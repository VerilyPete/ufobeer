name: D1 Backup

# Weekly logical export of the production D1 database to R2, complementing
# D1 Time Travel (30-day point-in-time restore) with an off-platform copy.
# Requires:
# - R2 bucket `ufobeer-backups` (set a 90-day object lifecycle rule)
# - GitHub secret CLOUDFLARE_BACKUP_API_TOKEN scoped to D1:Edit + Workers R2
#   Storage:Edit for this account (see plans/security-runbook.md)
# - Existing secret CLOUDFLARE_ACCOUNT_ID

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Export D1 database
        run: npx wrangler d1 export beer-db --remote --output=ufobeer-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload export to R2
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          npx wrangler r2 object put "ufobeer-backups/ufobeer-backup-${STAMP}.sql" \
            --file=ufobeer-backup.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove local export
        if: always()
        run: rm -f ufobeer-backup.sql

name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys — second push waits for first to finish.
# cancel-in-progress: false ensures a running migration is never interrupted.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:test

      - name: Run tests
        run: npx vitest run

      - name: Install tail worker deps
        run: npm ci --prefix workers/error-alerts

      - name: Type check tail worker
        run: npm run typecheck --prefix workers/error-alerts

      - name: Test tail worker
        run: npm test --prefix workers/error-alerts -- run

      - name: Deploy tail worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/error-alerts
          command: deploy

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --remote is REQUIRED (wrangler v4 defaults to --local)
          # preCommands inherits CLOUDFLARE_API_TOKEN env var set by wrangler-action
          preCommands: wrangler d1 migrations apply beer-db --remote
          command: deploy
